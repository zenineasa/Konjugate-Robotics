<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
    <title>Robotics</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="toolbar" role="toolbar" aria-label="Drawing tools">
        <div class="group" aria-label="Add a solid">
            <span class="groupLabel">Add</span>
            <button type="button" class="tool" data-add="box" title="Add a box (B)"><span class="glyph">■</span>Box</button>
            <button type="button" class="tool" data-add="cylinder" title="Add a cylinder (C)"><span class="glyph">▮</span>Cylinder</button>
            <button type="button" class="tool" data-add="sphere" title="Add a sphere (S)"><span class="glyph">●</span>Sphere</button>
            <button type="button" class="tool" data-add="capsule" title="Add a capsule (P)"><span class="glyph">⬮</span>Capsule</button>
        </div>
        <div class="group" aria-label="Tools">
            <button type="button" class="tool" data-tool="select" title="Select: click a solid or a joint (Escape)"><span class="glyph">↖</span>Select</button>
            <button type="button" class="tool" data-tool="move" title="Move the selected solid and what it carries (G)"><span class="glyph">✥</span>Move</button>
            <button type="button" class="tool" data-tool="turn" title="Turn the selected solid and what it carries (R)"><span class="glyph">⟳</span>Turn</button>
            <button type="button" class="tool" data-tool="join" title="Join two solids: click a point on each (J)"><span class="glyph">⊕</span>Join</button>
            <label class="inline" title="The kind of joint the Join tool makes">as
                <select id="joinKind" aria-label="Kind of joint to make">
                    <option value="hinge">Hinge</option>
                    <option value="slider">Slider</option>
                    <option value="ball">Ball</option>
                    <option value="fixed">Fixed</option>
                </select>
            </label>
        </div>
        <div class="group" aria-label="Edit">
            <button type="button" class="tool" id="duplicateButton" title="Duplicate the selected solids"><span class="glyph">⧉</span>Duplicate</button>
            <button type="button" class="tool" id="deleteButton" title="Delete what is selected"><span class="glyph">✕</span>Delete</button>
            <button type="button" class="tool" id="undoButton" title="Undo"><span class="glyph">↶</span>Undo</button>
            <button type="button" class="tool" id="redoButton" title="Redo"><span class="glyph">↷</span>Redo</button>
        </div>
        <div class="group" aria-label="View">
            <button type="button" class="tool" id="fitButton" title="Fit the robot in the view (F)"><span class="glyph">⛶</span>Fit</button>
            <select id="viewSide" aria-label="Look from" title="Look from a side">
                <option value="">Look from…</option>
                <option value="iso">Above, at an angle</option>
                <option value="front">The front</option>
                <option value="right">The right</option>
                <option value="top">The top</option>
            </select>
            <label class="inline" title="Move in 5 mm steps and turn in 15 degree steps"><input type="checkbox" id="snapToggle" checked> Snap</label>
        </div>
        <div class="spacer"></div>
        <select id="exampleSelect" aria-label="Start from an example" title="Start from an example (undo brings your drawing back)">
            <option value="">Examples…</option>
        </select>
        <button type="button" class="tool" id="openButton" title="Open a drawing from a JSON file">Open…</button>
        <button type="button" class="tool" id="importButton" title="Import a robot from a MuJoCo model: from Menagerie or from its files (I)">Import robot…</button>
        <button type="button" class="tool" id="sizeButton" aria-pressed="false" title="Will these motors do it? Run the robot and size its motors (M)"><span class="glyph">⚡</span>Size</button>
        <button type="button" class="primary" id="buildButton" title="Build the robot into the canvas">Build into canvas</button>
        <button type="button" class="tool" id="helpButton" title="Keys and gestures (?)" aria-label="Keys and gestures">?</button>
    </header>

    <main class="layout">
        <aside class="panel left" aria-label="Robot">
            <label class="field"><span>Robot</span><input id="robotName" type="text" autocomplete="off" spellcheck="false"></label>
            <h2>Parts</h2>
            <ul class="tree" id="partsTree" role="tree" aria-label="Solids and joints"></ul>
            <h2>Checks</h2>
            <ul class="checks" id="checksList" aria-live="polite"></ul>
            <p class="muted small" id="buildStatus" aria-live="polite"></p>
            <h2>Pose</h2>
            <div id="posePanel" class="posePanel" aria-label="Pose and keyframes"></div>
        </aside>

        <section class="viewport" id="viewport" aria-label="3D view">
            <div class="hint" id="hint" aria-live="polite"></div>
            <div class="toast" id="toast" role="status" hidden></div>
            <section class="sizing" id="sizingPanel" aria-label="Will these motors do it?" hidden></section>
        </section>

        <aside class="panel right" id="inspector" aria-label="Selected part"></aside>
    </main>

    <dialog id="helpDialog">
        <h2>Keys and gestures</h2>
        <table id="helpTable"></table>
        <form method="dialog"><button class="primary">Close</button></form>
    </dialog>

    <dialog id="importDialog" aria-label="Import a robot">
        <h2>Import a robot</h2>
        <div id="importBody"></div>
        <form method="dialog"><button class="primary">Close</button></form>
    </dialog>

    <script type="module" src="toolbox.mjs"></script>
</body>
</html>

name: Release

# Deliberately not triggered on every push -- only an explicit version tag (or a manual run)
# builds a signed release. build.yml remains the separate, unsigned verification workflow run
# by hand. A single .kja is uploaded directly (not zipped) under a fixed
# filename -- registry/konjugate.robotics.json's downloadUrl points at
# releases/latest/download/<that fixed name>, which always resolves to the current release's
# asset, so the registry entry never needs updating per release.
on:
    push:
        tags: ['v*']
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Check out this repo
              uses: actions/checkout@v4
              with:
                  path: konjugate-robotics
            - name: Check out Konjugate core
              uses: actions/checkout@v4
              with:
                  repository: zenineasa/Konjugate
                  path: konjugate
            - uses: actions/setup-node@v4
              with:
                  node-version: 24.19.0
            - name: Check the tag matches package.json's version
              if: startsWith(github.ref, 'refs/tags/v')
              working-directory: konjugate-robotics
              run: |
                  version=$(node -p "require('./package.json').version")
                  if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
                      echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version."
                      exit 1
                  fi
            - name: Install Konjugate core's dependencies
              working-directory: konjugate
              run: npm ci
            - name: Run tests
              working-directory: konjugate-robotics
              run: npm test
            - name: Build the add-on
              working-directory: konjugate-robotics
              run: npm run build
            # This workflow is never triggered by pull_request (only push:tags
            # and workflow_dispatch), so GitHub always makes secrets available here -- no fork-PR
            # exfiltration risk to guard against, so signing runs unconditionally.
            - name: Sign the built package
              working-directory: konjugate-robotics
              env:
                  ROBOTICS_SIGNING_PRIVATE_KEY: ${{ secrets.ROBOTICS_SIGNING_PRIVATE_KEY }}
              run: node scripts/signPackage.mjs
            - name: Verify the signature against the registry
              working-directory: konjugate-robotics
              run: node scripts/verifySignedPackages.mjs
            - name: Rename to a fixed, version-free release filename
              working-directory: konjugate-robotics
              run: |
                  mkdir -p dist
                  cp out/*.kja dist/konjugate.robotics.kja
            - uses: actions/upload-artifact@v4
              with:
                  name: release
                  path: konjugate-robotics/dist/konjugate.robotics.kja
                  if-no-files-found: error

    release:
        needs: build
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@v4
              with:
                  path: dist
                  merge-multiple: true
            - uses: softprops/action-gh-release@v2
              with:
                  files: dist/*
                  generate_release_notes: true
                  body: |
                      > **Verifying this download:** this package is signed under the `konjugate.robotics` namespace prefix; see [docs/registry.md](https://github.com/zenineasa/Konjugate/blob/main/docs/registry.md) in the Konjugate core repo for what that means and how `verifyPackageArchive` checks it. This is a trust signal, not a requirement: installing an unsigned or unverified package works exactly the same.
